[project]
name = "hunch-jev"
version = "0.2.0"
description = "Plain function verbs on Jev: classify, score, check, pick, rank, generate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Steven Shoemaker" }]
dependencies = [
    "typesafe-sdk>=0.7.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/steven-shoemaker/hunch"
Repository = "https://github.com/steven-shoemaker/hunch"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100
